body{font-family:system-ui,sans-serif;max-width:760px;margin:2rem auto;padding:0 1rem;color:#222;background:#fff}
fieldset{margin:.5rem 0}label{display:block;margin:.3rem 0}

<main hidden>
<h1 id="titulo">Organize as provas da sua disputa de chargeback</h1>
<p id="o1"></p>
<p id="ag1"></p>
<p id="aviso" role="alert" hidden></p>
<label><input type="checkbox" id="a1"> <span id="a1-texto"></span></label>
<section id="form" hidden>
  <h2>1. Identificação</h2>
  <label>Identificação do pedido <input type="text" id="pedido" autocomplete="off"></label>
  <label>4 últimos dígitos do cartão (opcional) <input type="text" id="ultimos4" inputmode="numeric" autocomplete="off"></label>
  <label>CNPJ (opcional) <input type="text" id="cnpj" autocomplete="off"></label>
  <label><input type="checkbox" id="p1" disabled> <span id="p1-texto"></span></label>
  <label>Gateway ou adquirente <select id="gateway"><option value="">(não informar)</option></select></label>
  <label>Motivo indicado pela adquirente <select id="motivo"></select></label>
  <p id="fonte-motivo"></p>
  <p id="secao-motivo" hidden></p>
  <p id="obs-motivo" hidden></p>
  <p id="rodape-elo" hidden></p>
  <p id="rodape-prazos"></p>
  <h2>2. Cronologia</h2>
  <p id="a2-texto"></p>
  <label>Data <input type="date" id="fato-data"></label>
  <label>Fato <textarea id="fato-desc" rows="3"></textarea></label>
  <button type="button" id="add-fato">Adicionar fato</button>
  <ul id="lista-fatos"></ul>
  <h2>3. Documentos</h2>
  <input type="file" id="docs" multiple>
  <h2>4. Evidências do motivo</h2>
  <div id="vinculos"></div>
  <button type="button" id="gerar">Gerar dossiê</button>
  <pre id="previa"></pre>
  <div id="etapa-d1" hidden>
    <label><input type="checkbox" id="d1"> <span id="d1-texto"></span></label>
    <button type="button" id="baixar" disabled>Baixar dossiê</button>
  </div>
</section>
<details><summary>Termos</summary><div id="termos"></div></details>
</main>
<footer hidden><p id="r1"></p><p id="r2"></p></footer>

// Luhn de qualquer janela de um grupo em O(1), com somas acumuladas por paridade.
function luhnJanelas(d) {
  const n = d.length, P = [new Int32Array(n + 1), new Int32Array(n + 1)], D = [new Int32Array(n + 1), new Int32Array(n + 1)];
  for (let k = 0; k < n; k++) {
    const v = d.charCodeAt(k) - 48, w = v * 2 > 9 ? v * 2 - 9 : v * 2, q = k & 1;
    for (const r of [0, 1]) { P[r][k + 1] = P[r][k] + (r === q ? v : 0); D[r][k + 1] = D[r][k] + (r === q ? w : 0); }
  }
  // janela [i, f): o último dígito (f-1) não dobra; dobram os de paridade diferente da dele
  return (i, f) => { const r = (f - 1) & 1, o = r ^ 1; return (P[r][f] - P[r][i] + D[o][f] - D[o][i]) % 10 === 0; };
}

// CB-07 / laudos C-01, C-02, C-03, A-04: o texto vira uma lista de grupos de dígitos. Dois grupos
// ficam na mesma cadeia quando entre eles há só separadores (qualquer quantidade de qualquer
// caractere que não é letra nem dígito) ou uma única letra solta ("4111 0000 e 0000 0008").
// Em cada cadeia:
// (a) PAN em grupos inteiros consecutivos (13 a 19 dígitos), o mais longo primeiro;
// (b) se (a) não achou, grupo com 20 ou mais dígitos, ou com 14 a 19 que não começa com prefixo
//     de bandeira (PAN colado a outros dígitos, nos dois lados ou dois PANs colados): toda janela de 13 a 19 dígitos em qualquer posição, só com prefixo de bandeira
//     (CB-01 estrito) e Luhn; achado um PAN, a busca continua depois dele.
// Tempo linear: até 19 grupos por início em (a); 7 janelas por dígito com Luhn O(1) em (b).
const SEP_SIMPLES = /^[^\p{L}\p{N}]+$/u;
const SEP_LETRA = /^[^\p{L}\p{N}]+\p{L}[^\p{L}\p{N}]+$/u;
function ehSep(t) { return SEP_SIMPLES.test(t) || (t.length <= 12 && SEP_LETRA.test(t)); }
const TAMANHOS = [16, 15, 19, 18, 17, 14, 13];
function mascararCartao(texto, livre = false) {
  const base = textoDeAnalise(texto);
  const re = /\d+/g, g = []; let m;
  while ((m = re.exec(base))) g.push({ i: m.index, f: m.index + m[0].length, d: m[0] });
  const trocas = [];                                   // {i, f, u} em ordem, posições do texto
  let k = 0;
  while (k < g.length) {
    let fim = k;
    while (fim + 1 < g.length && ehSep(base.slice(g[fim].f, g[fim + 1].i))) fim++;
    let j = k;
    while (j <= fim) {
      const dj = g[j].d;
      let achou = null, e = j, n = 0;
      while (e <= fim && n + g[e].d.length <= 19) { n += g[e].d.length; e++; }
      for (let x = e - 1; x >= j && !achou; x--) {
        if (n >= 13) {
          let d = ''; for (let y = j; y <= x; y++) d += g[y].d;
          if (ehPAN(d, livre)) achou = { i: g[j].i, f: g[x].f, u: d.slice(-4), prox: x + 1 };
        }
        n -= g[x].d.length;
      }
      if (achou) { trocas.push(achou); j = achou.prox; continue; }
      // (b) varre janelas no grupo: 20+ dígitos, ou 14-19 dígitos que não começam com prefixo de
      // bandeira (PAN colado entre outros dígitos, ex. 99 + Amex + 11). Um grupo de 14-19 que já
      // começa como cartão e falhou no Luhn não é varrido por dentro (laudo 20fa739: 8 casos keep).
      if (dj.length >= 20 || (dj.length >= 14 && !prefixoDeCartao(dj, false))) {
        const lj = luhnJanelas(dj);
        let p = 0;
        while (p + 13 <= dj.length) {
          let L0 = 0;
          const w = dj.substr(p, 4);
          if (prefixoDeCartao(w, false)) {
            for (const L of TAMANHOS) {
              if (p + L > dj.length || (L === 14 && !/^3[0689]/.test(w))) continue;
              if (lj(p, p + L)) { L0 = L; break; }
            }
          }
          if (L0) { trocas.push({ i: g[j].i + p, f: g[j].i + p + L0, u: dj.substr(p + L0 - 4, 4) }); p += L0; } else p++;
        }
      }
      j++;
    }
    k = fim + 1;
  }
  if (!trocas.length) return { texto, removido: false };
  let out = '', pos = 0;
  for (const t of trocas) { out += texto.slice(pos, t.i) + `**** **** **** ${t.u}`; pos = t.f; }
  return { texto: out + texto.slice(pos), removido: true };
}

const ENTRE = '(?:\\s+\\S+){0,3}?\\s*[:=]?\\s*';           // até 3 palavras (CP-02), só fora do CVV
// CP2-01 (literal da revisão v0.2): só palavras de ligação entre o termo e o número.
const ENTRE_CVV = '(?:\\s+(?:é|e|era|foi|do|da|de|o|a|meu|seu|cart[aã]o|informado|digitado|:)){0,3}\\s*[:=]?\\s*';
const T_CVV = '(?:cvv2?|cvc2?|c[oó]d(?:igo|\\.)?\\s+de\\s+seguran[cç]a|c[oó]d(?:igo|\\.)?\\s+verificador)';
const MMAA = '(?:0[1-9]|1[0-2])\\s*[\\/-]\\s*(?:\\d{4}|\\d{2})(?!\\d)';
const CARTAO = 'cart[aã]o';
const T_VENCE = '(?:vence|venc\\.|vencimento|expira(?:[cç][aã]o)?)';

const CVV_VALOR = new RegExp(`(?<![\\p{L}\\d])${T_CVV}(?![\\p{L}\\d])${ENTRE_CVV}\\d{3,4}(?![\\d/.,-]\\d)(?!\\d)`, 'iu');
// Valor de cartão: o campo é limpo (CB-07).
const VALOR = [
  CVV_VALOR,
  new RegExp(`\\bcid\\s+(?:d[oe]\\s+)?${CARTAO}${ENTRE}\\d{3,4}(?!\\d)`, 'i'),
  new RegExp(`\\b(?:exp|v[aá]lido\\s+at[eé])${ENTRE}${MMAA}`, 'i'),
  new RegExp(`\\b${CARTAO}\\b[^\\n]{0,40}?\\bval(?:idade|\\.)?${ENTRE}${MMAA}`, 'i'),
  new RegExp(`\\bval(?:idade|\\.)?\\s+(?:d[oe]\\s+)?${CARTAO}${ENTRE}${MMAA}`, 'i'),
  /%B\d{12,19}\^/,            // trilha 1
  /;\d{12,19}=\d{4,}/          // trilha 2
];
// CP2-02: vence/expira MM/AA só limpa com "cartão" a até 40 caracteres, CVV com valor ou PAN no mesmo campo.
const VENCE = new RegExp(`\\b${T_VENCE}${ENTRE}${MMAA}`, 'i');
const VENCE_CARTAO = [
  new RegExp(`\\b${CARTAO}\\b[^\\n]{0,40}?\\b${T_VENCE}${ENTRE}${MMAA}`, 'i'),
  new RegExp(`\\b${T_VENCE}${ENTRE}${MMAA}[^\\n]{0,40}?\\b${CARTAO}\\b`, 'i')
];
// Mera menção ou caso ambíguo: mantém o texto e só alerta (CP-03, CP2-02).
const MENCAO = [
  new RegExp(`\\b${T_CVV}\\b`, 'i'),
  new RegExp(`\\bvalidade${ENTRE}${MMAA}`, 'i'),
  VENCE,
  /\bcid\s*[:=]?\s*\d{3,4}(?!\d)/i
];

function temPAN(texto) { return mascararCartao(texto, true).removido; }
function temValorDeCartao(texto) {
  if (VALOR.some((r) => r.test(texto))) return true;
  if (VENCE.test(texto) && (VENCE_CARTAO.some((r) => r.test(texto)) || temPAN(texto) || CVV_VALOR.test(texto))) return true;
  return false;
}
function temMencao(texto) { return MENCAO.some((r) => r.test(texto)); }

// Saneamento completo (paste, blur, antes do dossiê).
// A-3 quando há remoção ou máscara; A-3b quando o texto é mantido (CP2-03).
function sanear(texto, livre = true) {
  if (temValorDeCartao(texto)) return { texto: '', aviso: TEXTOS['A-3'], limpo: true };
  const m = mascararCartao(texto, livre);
  if (m.removido) return { texto: m.texto, aviso: TEXTOS['A-3'], limpo: false };
  return { texto: m.texto, aviso: temMencao(m.texto) ? TEXTOS_REVISAO['A-3b'] : null, limpo: false };
}

// Controlador de campo (CP-01): digitar não altera o valor; paste, blur e
// geração do dossiê saneiam. CB-01: recebe o id do campo, para a exceção de CNPJ
// (sanearCampo) valer no mesmo caminho que a página usa.
function controladorCampo(id) {
  return {
    aoDigitar: (v) => ({ texto: v, aviso: null }),
    aoColar: (v) => sanearCampo(id, v),
    aoSair: (v) => sanearCampo(id, v)
  };
}

function validarUltimos4(v) { return v === '' || /^\d{4}$/.test(v); }

// CP-05: CNPJ com dígitos verificadores válidos.
function validarCNPJ(v) {
  const d = String(v).replace(/\D/g, '');
  if (d.length !== 14 || /^(\d)\1{13}$/.test(d)) return false;
  const dv = (n) => {
    const pesos = n === 12 ? [5,4,3,2,9,8,7,6,5,4,3,2] : [6,5,4,3,2,9,8,7,6,5,4,3,2];
    const s = pesos.reduce((a, p, i) => a + p * Number(d[i]), 0);
    const r = s % 11; return r < 2 ? 0 : 11 - r;
  };
  return dv(12) === Number(d[12]) && dv(13) === Number(d[13]);
}

// CB-01: no campo CNPJ, um CNPJ válido (só dígitos e pontuação de CNPJ) não é tratado
// como cartão; 14 dígitos com DV válido podem passar no Luhn. Qualquer outro valor é saneado.
const FORMATO_CNPJ = /^\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}$/;
// Parecer B-02: a exceção não vale quando os 14 dígitos também são um PAN Diners válido
// (prefixo 30/36/38/39 e Luhn); nesse caso o campo é mascarado como qualquer outro.
function sanearCampo(id, texto) {
  if (id === 'cnpj' && FORMATO_CNPJ.test(texto.trim()) && validarCNPJ(texto) && !ehPAN(texto.replace(/\D/g, ''), false)) return { texto, aviso: null, limpo: false };
  return sanear(texto, id !== 'pedido');
}

function norm(s) { return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
const TODOS_VEDADOS = [...VEDADOS, ...VEDADOS_EXTRA];
function encontrarVedados(texto) {
  const t = norm(texto);
  return TODOS_VEDADOS.filter((v) => {
    const e = norm(v).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return new RegExp(`(^|[^a-z0-9])${e}(?=$|[^a-z0-9])`).test(t);
  });
}

// CP-07: allowlist por igualdade exata da string inteira.
function allowlist(matriz) {
  return new Set([...Object.values(TEXTOS), ...Object.values(TEXTOS_REVISAO), AG1, RODAPE_MATRIZ, RODAPE_ELO, RODAPE_PRAZOS,
    ...GATEWAYS, ...matriz.map(linhaFonte), ...matriz.map((m) => m.secao_pagina).filter(Boolean), ...matriz.map((m) => m.observacao).filter(Boolean),
    ...matriz.flatMap((m) => m.evidencias), ...matriz.map((m) => m.motivo)]);
}
function vedadosNaPagina(textos, matriz) {
  const ok = allowlist(matriz);
  return textos.filter((t) => !ok.has(t) && encontrarVedados(t).length).map((t) => ({ texto: t, vedados: encontrarVedados(t) }));
}

// Dossiê (CB-02). P-1 não entra (CP-09).
function montarDossie({ pedido, ultimos4, cnpj, gateway, motivo, fatos, documentos, vinculos }) {
  const ordenados = [...fatos].sort((a, b) => a.data.localeCompare(b.data));
  const L = [];
  L.push('DOSSIÊ DE DISPUTA DE CHARGEBACK', '', '1. Identificação do pedido');
  L.push(`Pedido: ${pedido}`);
  if (ultimos4) L.push(`Cartão: **** **** **** ${ultimos4}`);
  if (cnpj) L.push(`CNPJ do lojista: ${cnpj}`);
  if (gateway) L.push(`Gateway ou adquirente: ${gateway}`);
  L.push(`Motivo informado: ${rotuloMotivo(motivo)}`, '', '2. Cronologia');
  for (const f of ordenados) L.push(`${f.data}: ${f.descricao}`);
  L.push('', '3. Documentos anexados pelo lojista');
  documentos.forEach((d, i) => L.push(`D${i + 1}. ${d.nome} (${d.tamanho} bytes)`));
  L.push('', '4. Correspondência documento x requisito de evidência');
  motivo.evidencias.forEach((ev, i) => {
    const ds = (vinculos[i] || []).map((k) => `D${k + 1}`);
    L.push(`${ev}: ${ds.length ? ds.join(', ') : 'nenhum documento anexado'}`);
  });
  if (motivo.observacao && motivo.observacao !== linhaFonte(motivo)) L.push(motivo.observacao);
  L.push(linhaFonte(motivo));
  if (motivo.secao_pagina) L.push(motivo.secao_pagina);
  L.push(RODAPE_MATRIZ, RODAPE_PRAZOS);
  if (motivo.bandeira === 'Elo') L.push(RODAPE_ELO);
  const texto = L.join('\n') + '\n';
  return { texto, vedados: encontrarVedados(texto) };
}

// CP-04: em build de piloto, a linha de exemplo bloqueia o dossiê.
function dossieBloqueadoPorExemplo(piloto, matriz) { return piloto === true && matrizTemExemplo(matriz); }

function podeBaixar({ a1, d1, vedados, bloqueado = false }) {
  return a1 === true && d1 === true && vedados.length === 0 && !bloqueado;
}






const $ = (id) => document.getElementById(id);
const estado = { documentos: [], fatos: [], dossie: null };

function txt(id, t) { $(id).textContent = t; }
function aviso(msg) { const a = $('aviso'); a.textContent = msg || ''; a.hidden = !msg; }

function iniciar() {
  document.title = TITULO;
  txt('titulo', TITULO);
  txt('o1', TEXTOS['O-1']);
  txt('ag1', AG1);
  txt('rodape-prazos', RODAPE_PRAZOS);
  txt('a1-texto', TEXTOS['A-1']);
  txt('a2-texto', TEXTOS['A-2']);
  txt('d1-texto', TEXTOS['D-1']);
  txt('p1-texto', TEXTOS['P-1']);
  txt('r1', TEXTOS['R-1']);
  txt('r2', TEXTOS['R-2']);
  const termos = $('termos');
  const termosVisiveis = ['T-1', 'T-2', 'T-3', 'T-4', 'T-5', 'T-6'].concat(COBRANCA ? ['T-7'] : []); // CP-06
  for (const k of termosVisiveis) {
    const p = document.createElement('p'); p.textContent = TEXTOS[k]; termos.appendChild(p);
  }
  // main e footer saem do HTML com hidden e só aparecem com os textos já preenchidos. Pintados
  // vazios (HTML em mais de um pedaço), o aceite A-1 descia quando os textos entravam (CLS 0,19).
  document.querySelector('main').hidden = false;
  document.querySelector('footer').hidden = false;
  const sel = $('motivo');
  MATRIZ.forEach((m, i) => {
    const o = document.createElement('option'); o.value = String(i);
    o.textContent = rotuloMotivo(m); sel.appendChild(o);
  });
  const gsel = $('gateway');
  GATEWAYS.forEach((g) => { const o = document.createElement('option'); o.value = g; o.textContent = g; gsel.appendChild(o); });

  $('a1').addEventListener('change', () => { $('form').hidden = !$('a1').checked; });

  // CP-01: digitar não saneia; paste, saída do campo e geração do dossiê saneiam.
  document.querySelectorAll('input[type=text], textarea').forEach((el) => {
    if (el.id === 'ultimos4') return;
    const ctl = controladorCampo(el.id);
    const aplicar = (fn) => { const r = fn(el.value); if (r.aviso) aviso(r.aviso); if (r.texto !== el.value) el.value = r.texto; };
    el.addEventListener('paste', () => setTimeout(() => aplicar(ctl.aoColar), 0));
    el.addEventListener('blur', () => aplicar(ctl.aoSair));
    el.addEventListener('change', () => aplicar(ctl.aoSair));
  });

  // CP-05: P-1 só com CNPJ válido; continua opcional e desmarcado.
  const atualizarP1 = () => { const ok = validarCNPJ($('cnpj').value); $('p1').disabled = !ok; if (!ok) $('p1').checked = false; };
  $('cnpj').addEventListener('input', atualizarP1);
  $('cnpj').addEventListener('change', atualizarP1);
  atualizarP1();

  // Só os 4 últimos dígitos: mais de 4 dígitos (PAN digitado ou colado) limpa o campo + A-3.
  const ultimos4 = () => {
    const el = $('ultimos4'); const d = el.value.replace(/\D/g, '');
    if (d.length > 4) { el.value = ''; aviso(TEXTOS['A-3']); } else if (el.value !== d) el.value = d;
  };
  $('ultimos4').addEventListener('input', ultimos4);
  $('ultimos4').addEventListener('paste', () => setTimeout(ultimos4, 0));

  $('docs').addEventListener('change', (e) => {
    // Só nome e tamanho; o conteúdo do arquivo não é lido.
    estado.documentos = [...e.target.files].map((f) => ({ nome: sanear(f.name).texto || '[nome removido]', tamanho: f.size }));
    renderVinculos();
  });
  $('motivo').addEventListener('change', renderVinculos);

  $('add-fato').addEventListener('click', () => {
    // CB-02: o blur do campo roda antes do clique e já mascarou o cartão e mostrou o A-3;
    // aqui o texto chega mascarado e sanear() não devolve mais o A-3.
    const a3Visivel = !$('aviso').hidden && $('aviso').textContent.startsWith(TEXTOS['A-3']);
    const data = $('fato-data').value;
    const desc = sanear($('fato-desc').value);
    if (desc.aviso) aviso(desc.aviso);
    $('fato-desc').value = desc.texto;
    if (!data || !desc.texto.trim()) return;
    // CB-02: fato com termo vedado não entra; o texto fica no campo para edição.
    // A recusa se soma ao A-3 que estava visível, em vez de substituí-lo.
    const vedados = encontrarVedados(desc.texto);
    if (vedados.length) return aviso([a3Visivel ? TEXTOS['A-3'] : desc.aviso, `Remova os termos não permitidos no fato: ${vedados.join(', ')}.`].filter(Boolean).join(' '));
    estado.fatos.push({ data, descricao: desc.texto.trim() });
    $('fato-desc').value = '';
    renderFatos();
  });

  $('gerar').addEventListener('click', gerar);
  $('d1').addEventListener('change', atualizarBaixar);
  $('baixar').addEventListener('click', baixar);
  renderVinculos();
}

function renderFatos() {
  const ul = $('lista-fatos'); ul.textContent = '';
  const ordenados = [...estado.fatos].sort((a, b) => a.data.localeCompare(b.data));
  ordenados.forEach((f, i) => {
    const li = document.createElement('li'); li.textContent = `${f.data}: ${f.descricao} `;
    // CB-02: remover o fato invalida o dossiê já gerado, que ainda o contém.
    const rm = document.createElement('button'); rm.type = 'button'; rm.textContent = 'Remover';
    // Nome próprio por botão: data do fato e, se houver mais de um no dia, a ordem.
    const doDia = ordenados.filter((g) => g.data === f.data);
    rm.setAttribute('aria-label', `Remover fato de ${f.data.split('-').reverse().join('/')}` + (doDia.length > 1 ? ` (${doDia.indexOf(f) + 1}º do dia)` : ''));
    rm.addEventListener('click', () => {
      estado.fatos.splice(estado.fatos.indexOf(f), 1);
      estado.dossie = null; $('previa').textContent = ''; $('etapa-d1').hidden = true; atualizarBaixar(); aviso('');
      renderFatos();
      // O botão focado foi recriado: foco no Remover seguinte, ou no anterior; sem fatos, no campo do fato.
      const bs = $('lista-fatos').querySelectorAll('button');
      (bs[i] || bs[i - 1] || $('fato-desc')).focus();
    });
    li.appendChild(rm); ul.appendChild(li);
  });
}

function renderVinculos() {
  const m = MATRIZ[Number($('motivo').value) || 0];
  txt('fonte-motivo', linhaFonte(m));
  const sp = $('secao-motivo'); sp.textContent = m.secao_pagina || ''; sp.hidden = !sp.textContent;
  const obs = $('obs-motivo'); obs.textContent = m.observacao && m.observacao !== linhaFonte(m) ? m.observacao : ''; obs.hidden = !obs.textContent;
  const elo = $('rodape-elo'); elo.textContent = m.bandeira === 'Elo' ? RODAPE_ELO : ''; elo.hidden = !elo.textContent;
  const box = $('vinculos'); box.textContent = '';
  m.evidencias.forEach((ev, i) => {
    const fs = document.createElement('fieldset');
    const lg = document.createElement('legend'); lg.textContent = ev; fs.appendChild(lg);
    estado.documentos.forEach((d, k) => {
      const l = document.createElement('label');
      const c = document.createElement('input'); c.type = 'checkbox'; c.dataset.ev = String(i); c.dataset.doc = String(k);
      l.appendChild(c); l.append(` D${k + 1}. ${d.nome}`); fs.appendChild(l);
    });
    box.appendChild(fs);
  });
}

function gerar() {
  aviso('');
  if (dossieBloqueadoPorExemplo(PILOTO, MATRIZ)) return aviso('Build de piloto com linha de exemplo na matriz: dossiê bloqueado.');
  let alerta = null;
  for (const id of ['pedido', 'cnpj']) { const r = sanearCampo(id, $(id).value); $(id).value = r.texto; if (r.aviso) alerta = r.aviso; }
  if (alerta) aviso(alerta);
  const pedido = $('pedido').value.trim();
  const u4 = $('ultimos4').value;
  if (!pedido) return aviso('Informe a identificação do pedido.');
  if (!validarUltimos4(u4)) return aviso('Informe exatamente os 4 últimos dígitos, ou deixe em branco.');
  const motivo = MATRIZ[Number($('motivo').value) || 0];
  const vinculos = motivo.evidencias.map(() => []);
  document.querySelectorAll('#vinculos input:checked').forEach((c) => vinculos[Number(c.dataset.ev)].push(Number(c.dataset.doc)));
  const d = montarDossie({
    pedido, ultimos4: u4, cnpj: $('cnpj').value.trim(), gateway: $('gateway').value,
    motivo, fatos: estado.fatos, documentos: estado.documentos, vinculos
  });
  estado.dossie = d;
  $('previa').textContent = d.texto;
  if (d.vedados.length) aviso(`Remova os termos não permitidos no dossiê: ${d.vedados.join(', ')}.`);
  $('etapa-d1').hidden = false;
  atualizarBaixar();
}

function atualizarBaixar() {
  $('baixar').disabled = !(estado.dossie && podeBaixar({ a1: $('a1').checked, d1: $('d1').checked, vedados: estado.dossie.vedados, bloqueado: dossieBloqueadoPorExemplo(PILOTO, MATRIZ) }));
}

function baixar() {
  if ($('baixar').disabled) return;
  const blob = new Blob([estado.dossie.texto], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'dossie-chargeback.txt';
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

document.addEventListener('DOMContentLoaded', iniciar);

})();
