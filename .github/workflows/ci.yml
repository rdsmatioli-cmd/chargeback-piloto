name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - name: html-validate
        run: find . -name '*.html' -not -path './.git/*' -print0 | xargs -0 npx --yes html-validate@9.7.1 --max-warnings 0 -c .htmlvalidate.json
      # Hash de cada <script> inline no script-src da CSP da página. Sem ele o navegador bloqueia o
      # script e o app fica em branco. Para corrigir: node .github/scripts/conferir-csp.mjs --corrigir
      # Máscara de cartão: matriz de 171 casos do laudo QA 20fa739 e casos B-01/B-02 do parecer.
      # Dossiê: funções puras (dossie.test.mjs) e fluxo da página num DOM mínimo sem dependências
      # (fluxo.test.mjs + dom-minimo.mjs): o arquivo baixado tem de ser o dossiê da tela.
      # Páginas (pagina.test.mjs): <noscript>, aviso de navegador sem suporte, teste de suporte em ES5, CSP com Trusted
      # Types, símbolo do script sem uso, prévia de link do app e SEO técnico do blog (metas, JSON-LD, sitemap, rel).
      # Um arquivo de cada vez: em paralelo, o fluxo disputava CPU com os testes de tempo da máscara (A-03, < 100 ms).
      - name: Testes do app (máscara de cartão, dossiê, páginas e fluxo)
        run: node --test --test-concurrency=1 .github/testes/*.test.mjs
      # Fluxo no Chrome do runner, com o formulário visível (o Lighthouse e o html-validate só veem o estado inicial):
      # recusas com a mensagem junto do campo e dentro da tela, fato, documentos, geração e invalidação, fonte >= 16 px
      # e alvos >= 44 px, em 390 e 1280 px, e axe-core 4.14.0 (npm pack, sha512 conferido) sem violação em cada etapa.
      # Também sem JavaScript (<noscript>), sem lookbehind em regex (aviso de navegador sem suporte), Trusted Types da CSP
      # aplicados e /#form (link do blog) com foco no aceite A-1.
      # Local, da raiz: node .github/testes/fluxo-navegador.mjs (Chrome no PATH ou em CHROME_PATH).
      - name: Fluxo no Chrome e axe-core (formulário visível)
        run: node .github/testes/fluxo-navegador.mjs
      - name: CSP (hash dos scripts inline)
        run: node .github/scripts/conferir-csp.mjs
      # zizmor 1.30.1 em modo offline, persona padrão: falha o job em qualquer achado nos workflows e
      # no dependabot.yml (action sem SHA, credencial persistida...). Wheel manylinux x86_64 do PyPI,
      # com o sha256 conferido pelo pip. Local, da raiz: uvx zizmor@1.30.1 --offline .github
      - name: zizmor (segurança dos workflows)
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          echo 'zizmor==1.30.1 --hash=sha256:eee12266b793cb87ad4a7e3af2e72404f8a63e3de5eb099b80bf7b1cfd232a8e' > "$RUNNER_TEMP/zizmor.txt"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --disable-pip-version-check --require-hashes --only-binary :all: -r "$RUNNER_TEMP/zizmor.txt"
          "$RUNNER_TEMP/zizmor/bin/zizmor" --offline .github

  # Lighthouse 13.5.0 (versão fixa, sem @lhci/cli) com o repositório servido localmente.
  # Metas: blog SEO >= 0,90, Acessibilidade >= 0,95, CLS < 0,1, robots.txt e llms.txt válidos;
  # app (/) só Acessibilidade e CLS, porque é noindex de propósito. Chrome: o do runner.
  # O servidor manda o HTML em pedaços (14.600 bytes a cada 200 ms), para o CLS refletir a rede real.
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - name: Lighthouse 13.5.0 (blog, posts e app)
        run: node .github/scripts/lighthouse.mjs
