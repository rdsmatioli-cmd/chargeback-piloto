# Dependabot: só as GitHub Actions do ci.yml (fixadas por SHA com o comentário da versão).
# Não há package.json: o html-validate (ci.yml) e o Lighthouse (lighthouse.mjs) têm versão fixa
# no próprio comando e ficam de fora.
# Mensal (dia 1, 06:00 de Brasília), tudo num grupo só: no máximo um PR por mês, e cada PR roda o CI.
# cooldown: só propõe versão publicada há pelo menos 14 dias.
# Alertas e atualizações de segurança não se ligam aqui: Settings > Advanced Security.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '06:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - '*'
